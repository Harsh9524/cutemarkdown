<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Viewer</title>
<!--BASE-->
<style>
:root{
  --bg:#fdf8f5;--surface:#fff;--ink:#3a3340;--muted:#8a8191;--line:#f0e3e8;
  --accent:#e0558a;--accent2:#7c6ff0;--accent-soft:#fde8f0;--code-bg:#f8f0f4;--code-ink:#b8336a;
  --quote:#fff3f8;--shadow:0 6px 24px rgba(160,90,120,.10);
  --k:#c0398a;--s:#2f8f6b;--n:#d9822b;--c:#a79bb0;--add:#e3f6ea;--del:#fde6e8;
}
:root[data-theme=dark]{
  --bg:#1b1721;--surface:#251f2e;--ink:#ece6f2;--muted:#9b91a8;--line:#352e42;
  --accent:#ff8fb8;--accent2:#a79bff;--accent-soft:#3a2636;--code-bg:#2c2538;--code-ink:#ffadc9;
  --quote:#2a2132;--shadow:0 6px 24px rgba(0,0,0,.35);
  --k:#ff8fcb;--s:#7fdcae;--n:#ffb86b;--c:#7d7390;--add:#1f3a2c;--del:#43232c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* header */
header{position:sticky;top:0;z-index:6;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font:700 13px/1 "Cascadia Code",Consolas,monospace;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 3px 10px rgba(224,85,138,.35)}
.title{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.title b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{color:var(--muted);font-size:11.5px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ic{padding:0;width:32px;justify-content:center}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:9;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 3px 3px 0}

/* layout */
.wrap{display:flex;max-width:1240px;margin:0 auto}
nav{flex:none;width:250px;position:sticky;top:52px;align-self:flex-start;height:calc(100vh - 52px);overflow:auto;padding:26px 8px 30px 16px;font-size:13.5px;line-height:1.4}
nav h6{margin:0 0 10px 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
nav a{display:block;padding:5px 10px;margin:1px 0;border-radius:8px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav a:hover{background:var(--accent-soft);color:var(--ink)}
nav a.on{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
nav a.l2{padding-left:20px}nav a.l3{padding-left:30px}nav a.l4{padding-left:40px}
body.toc-off nav{display:none}
article{flex:1;min-width:0;max-width:800px;margin:0 auto;padding:34px 30px 120px}

/* empty state */
#empty{display:none;min-height:calc(100vh - 52px);place-items:center;padding:24px}
body.is-empty #empty{display:grid}
body.is-empty .wrap,body.is-empty #tocbtn,body.is-empty #zoom{display:none}
.drop{width:min(460px,100%);text-align:center;padding:42px 28px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:28px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.drop:hover,body.drag .drop{transform:translateY(-3px) scale(1.01);border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:96px;height:96px;margin-bottom:6px}
.drop h2{margin:6px 0 4px;font-size:21px}
.drop p{margin:0;color:var(--muted);font-size:14px}
.drop kbd{margin:0 2px}

/* content */
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{position:relative;line-height:1.3;margin:1.9em 0 .6em;font-weight:650;letter-spacing:-.01em}
.md h1{font-size:2.1em;margin-top:.2em;padding-bottom:.35em;background:linear-gradient(90deg,var(--accent),var(--accent2)) bottom/100% 3px no-repeat;}
.md h2{font-size:1.5em;padding-bottom:.28em;border-bottom:2px dotted var(--line)}
.md h3{font-size:1.22em}.md h4{font-size:1.05em}
.md h5,.md h6{font-size:.95em;color:var(--muted)}
.md .anchor{position:absolute;left:-1.1em;color:var(--accent);text-decoration:none;opacity:0;font-weight:400;transition:.15s;padding-right:.3em}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor,.md h5:hover .anchor,.md h6:hover .anchor{opacity:.8}
.md p{margin:.9em 0}
.md a{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px;transition:.15s}
.md a:hover{text-decoration-color:var(--accent)}
.md strong{font-weight:650}
.md img{max-width:100%;height:auto;border-radius:12px}
.md hr{border:0;height:0;border-top:3px dotted var(--line);margin:2.2em 0}
.md ul,.md ol{padding-left:1.6em;margin:.8em 0}
.md li{margin:.28em 0}.md li>p{margin:.4em 0}.md li>ul,.md li>ol{margin:.15em 0}
.md li::marker{color:var(--accent)}
.md li.task{list-style:none;margin-left:-1.4em}
.md li.task input{margin:0 .5em 0 0;accent-color:var(--accent);transform:scale(1.15);vertical-align:-1px}
.md code{font:.88em "Cascadia Code","Cascadia Mono",Consolas,monospace;background:var(--code-bg);color:var(--code-ink);padding:.15em .42em;border-radius:6px}
.md kbd{font:.8em "Cascadia Code",Consolas,monospace;padding:.12em .5em;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface)}
.md mark{background:#ffe58a;color:#4a3b00;padding:0 .2em;border-radius:4px}
.code{margin:1.1em 0;border-radius:16px;background:var(--code-bg);border:1px solid var(--line);overflow:hidden}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.copy{border:0;background:transparent;color:var(--muted);padding:3px 9px;border-radius:8px;font-size:11.5px;text-transform:none;letter-spacing:0}
.copy:hover{background:var(--accent-soft);color:var(--accent)}
.code pre{margin:0;padding:14px 16px;overflow:auto;line-height:1.55;tab-size:4}
.code pre code{background:none;color:var(--ink);padding:0;font-size:.86em}
.t-k{color:var(--k)}.t-s{color:var(--s)}.t-n{color:var(--n)}.t-c{color:var(--c);font-style:italic}
.d-add{background:var(--add);display:inline-block;width:100%}.d-del{background:var(--del);display:inline-block;width:100%}
.md blockquote{margin:1.1em 0;padding:.1em 1.1em;background:var(--quote);border-left:4px solid var(--accent);border-radius:4px 14px 14px 4px;color:color-mix(in srgb,var(--ink) 85%,var(--muted))}
.md blockquote>*:first-child{margin-top:.6em}.md blockquote>*:last-child{margin-bottom:.6em}
.alert{--ac:var(--accent2);border-left-color:var(--ac)!important}
.alert-title{margin:.7em 0 0!important;font-weight:650;color:var(--ac)}
.alert-tip{--ac:#2f9e6b}.alert-important{--ac:#a14fd6}.alert-warning{--ac:#d98a1f}.alert-caution{--ac:#d6455d}.alert-note{--ac:#4a86e8}
.tw{overflow-x:auto;margin:1.1em 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.md table{border-collapse:collapse;width:100%;font-size:.94em}
.md th,.md td{padding:8px 14px;border-bottom:1px solid var(--line);text-align:left}
.md th{background:var(--accent-soft);font-weight:650;white-space:nowrap}
.md tr:last-child td{border-bottom:0}
.md tbody tr:nth-child(even){background:color-mix(in srgb,var(--code-bg) 55%,transparent)}
.md details{margin:1em 0;padding:.5em 1em;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.md summary{cursor:pointer;font-weight:600}

#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:99px;font-size:13px;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:999px){
  nav{position:fixed;z-index:5;left:0;background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--shadow)}
  article{padding:24px 18px 100px}
}
@media print{header,nav,#bar,.copy,.anchor{display:none!important}body{background:#fff;color:#000}article{max-width:none;padding:0}}
</style>
</head>
<body class="is-empty">
<div id="bar"></div>
<header>
  <div class="logo">M↓</div>
  <div class="title"><b id="fname">MD Viewer</b><small id="meta">drop a markdown file to begin</small></div>
  <div class="sp"></div>
  <button class="btn" id="open" title="Open file (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</button>
  <button class="btn ic" id="tocbtn" title="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
  <button class="btn ic" id="theme" title="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
</header>

<div id="empty">
  <div class="drop" id="drop" tabindex="0">
    <svg viewBox="0 0 96 96"><rect x="16" y="8" width="64" height="80" rx="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/>
      <path d="M58 8v18a4 4 0 0 0 4 4h18" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="38" cy="50" r="4" fill="var(--ink)"/><circle cx="58" cy="50" r="4" fill="var(--ink)"/>
      <path d="M40 62q8 8 16 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="31" cy="60" r="4" fill="var(--accent)" opacity=".35"/><circle cx="65" cy="60" r="4" fill="var(--accent)" opacity=".35"/></svg>
    <h2>Drop a markdown file here</h2>
    <p>or click to browse · <kbd>Ctrl</kbd>+<kbd>O</kbd> · paste text with <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
  </div>
</div>

<div class="wrap">
  <nav id="toc"></nav>
  <article class="md" id="doc"></article>
</div>
<div id="toast"></div>
<input type="file" id="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
<!--BOOT-->

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const doc=$('#doc'),toc=$('#toc'),body=document.body;

/* ---------- helpers ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ta=document.createElement('textarea');
const unesc=h=>{ta.innerHTML=h;return ta.value};
const safeUrl=u=>{
  const t=u.replace(/[\u0000- ]/g,'').replace(/&amp;/g,'&');
  return /^(javascript|vbscript|data(?!:image\/(png|gif|jpe?g|webp|svg\+xml)[;,])):/i.test(t)?'#':u;
};
const ext=u=>/^https?:/i.test(u.replace(/&amp;/g,'&'));
const OK=new Set('a abbr b blockquote br center code dd del details div dl dt em figcaption figure h1 h2 h3 h4 h5 h6 hr i img ins kbd li mark ol p picture pre s small span strong sub summary sup table tbody td tfoot th thead tr u ul'.split(' '));
const ATTR=new Set(['href','src','alt','title','width','height','align','open','colspan','rowspan','valign']);

function sanitize(h){
  h=h.replace(/<!--[\s\S]*?-->/g,'').replace(/<(script|style|iframe|object|embed|template|noscript)\b[\s\S]*?<\/\1\s*>/gi,'');
  const re=/<(\/?)([a-zA-Z][\w:-]*)((?:"[^"]*"|'[^']*'|[^>"'])*)>/g;
  const txt=s=>s.replace(/</g,'&lt;');
  let out='',last=0,m;
  while((m=re.exec(h))){
    out+=txt(h.slice(last,m.index));last=re.lastIndex;
    const tag=m[2].toLowerCase();
    if(!OK.has(tag))continue;
    if(m[1]){out+='</'+tag+'>';continue}
    let at='';
    m[3].replace(/([a-zA-Z_:][\w:.-]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g,(x,n,a,b,c)=>{
      n=n.toLowerCase();if(!ATTR.has(n))return;
      let v=(a??b??c??'').replace(/&amp;/g,'&');
      v=(n==='href'||n==='src')?safeUrl(esc(v)):esc(v);
      at+=' '+n+'="'+v+'"';
    });
    if(tag==='a'&&/href="https?:/i.test(at))at+=' target="_blank" rel="noopener noreferrer"';
    if(tag==='img')at+=' loading="lazy"';
    out+='<'+tag+at+'>';
  }
  return out+txt(h.slice(last));
}

/* ---------- syntax highlight (small & generic) ---------- */
const KW='if|else|elif|for|while|do|return|function|def|class|const|let|var|import|from|export|default|new|try|catch|except|finally|throw|raise|async|await|yield|switch|case|break|continue|in|of|is|not|and|or|None|null|nil|true|false|True|False|self|this|static|public|private|protected|void|int|float|double|bool|string|struct|enum|interface|type|fn|pub|use|mod|impl|match|mut|func|package|with|as|lambda|pass|global|extends|implements|namespace|using|echo|then|fi|done|esac|select|where|insert|update|delete|create|table|param|foreach|end|begin|require|module|trait|where|typeof|instanceof|delete|get|set';
const HASH=/^(py|python|sh|bash|zsh|shell|yaml|yml|toml|ruby|rb|ps1|powershell|pwsh|dockerfile|make|makefile|r|conf|ini|perl|pl|cmake|env|gitignore)$/;
function hl(code,lang){
  lang=(lang||'').toLowerCase();
  if(lang==='diff'||lang==='patch')return esc(code).split('\n').map(l=>l[0]==='+'?'<span class="d-add">'+l+'</span>':l[0]==='-'?'<span class="d-del">'+l+'</span>':l[0]==='@'?'<span class="t-k">'+l+'</span>':l).join('\n');
  if(!lang||/^(text|txt|plain|plaintext|output|console|log)$/.test(lang))return esc(code);
  const markup=/^(html|xml|svg|vue|xhtml)$/.test(lang);
  const cm=markup?'<!--[\\s\\S]*?-->':HASH.test(lang)?'#[^\\n]*':/^(sql|lua|hs|haskell)$/.test(lang)?'--[^\\n]*':lang==='json'?null:'\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re=new RegExp([
    cm?'('+cm+')':'(?!)()',
    '("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)',
    '(\\b0x[0-9a-fA-F]+\\b|\\b\\d[\\d_.]*(?:[eE][+-]?\\d+)?\\b)',
    markup?'(<\\/?[a-zA-Z][\\w:-]*|\\/?>)':'\\b('+KW+')\\b'
  ].join('|'),'g');
  let out='',last=0,m;
  while((m=re.exec(code))){
    if(!m[0]){re.lastIndex++;continue}
    out+=esc(code.slice(last,m.index));
    const c=m[1]!==undefined&&m[1]!==''?'t-c':m[2]!==undefined?'t-s':m[3]!==undefined?'t-n':'t-k';
    out+='<span class="'+c+'">'+esc(m[0])+'</span>';last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}

/* ---------- inline ---------- */
let REFS={};
function link(url,text,title){
  url=safeUrl(url);
  return '<a href="'+url+'"'+(title?' title="'+title+'"':'')+(ext(url)?' target="_blank" rel="noopener noreferrer"':'')+'>'+text+'</a>';
}
function inline(s,st){
  const top=!st;st=st||[];
  const keep=h=>'\u0000'+(st.push(h)-1)+'\u0000';
  s=s.replace(/(`+)(?!`)([\s\S]*?[^`])\1(?!`)/g,(m,a,c)=>keep('<code>'+esc(c.replace(/\n/g,' ').replace(/^ (.*) $/,'$1'))+'</code>'));
  s=s.replace(/\\([!-\/:-@\[-`{-~])/g,(m,c)=>keep(esc(c)));
  s=s.replace(/<(https?:\/\/[^\s>]+)>/g,(m,u)=>keep(link(esc(u),esc(u))));
  s=s.replace(/<([^\s<>@]+@[^\s<>@]+\.[a-z]{2,})>/gi,(m,u)=>keep(link('mailto:'+esc(u),esc(u))));
  s=s.replace(/<(\/?)(kbd|sub|sup|b|i|u|em|strong|mark|small|ins|del|s|abbr|code|br)\s*\/?>/gi,(m,c,t)=>keep('<'+c+t.toLowerCase()+'>'));
  s=s.replace(/<img\b[^>]*>|<a\b[^>]*>|<\/a>/gi,m=>keep(sanitize(m)));
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(\s*((?:[^()\s]|\([^()\s]*\))*)(?:\s+&quot;(.*?)&quot;)?\s*\)/g,
    (m,alt,u,t)=>keep('<img src="'+safeUrl(u)+'" alt="'+alt+'"'+(t?' title="'+t+'"':'')+' loading="lazy">'));
  s=s.replace(/\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\(\s*((?:[^()\s]|\([^()\s]*\))*)(?:\s+&quot;(.*?)&quot;)?\s*\)/g,
    (m,t,u,ti)=>keep(link(u,inline(t,st),ti)));
  s=s.replace(/\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\[([^\]]*)\]/g,(m,t,id)=>{
    const r=REFS[(id||t).toLowerCase()];return r?keep(link(esc(r.url),inline(t,st),r.title&&esc(r.title))):m});
  s=s.replace(/\[([^\[\]]+)\](?!\()/g,(m,t)=>{const r=REFS[t.toLowerCase()];return r?keep(link(esc(r.url),inline(t,st),r.title&&esc(r.title))):m});
  s=s.replace(/(^|[\s(>])(https?:\/\/[^\s<\u0000]+?)(?=[.,;:!?)]*(?:\s|$|\u0000))/g,(m,p,u)=>p+keep(link(u,u)));
  s=s.replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g,'<strong><em>$1</em></strong>')
     .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g,'<strong>$1</strong>')
     .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g,'$1<strong>$2</strong>')
     .replace(/\*(?=\S)([^*]*?\S)\*/g,'<em>$1</em>')
     .replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g,'$1<em>$2</em>')
     .replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<del>$1</del>')
     .replace(/(?: {2,}|\\)\n/g,'<br>\n');
  if(top){let g=0;while(/\u0000\d+\u0000/.test(s)&&g++<12)s=s.replace(/\u0000(\d+)\u0000/g,(m,n)=>st[n])}
  return s;
}

/* ---------- blocks ---------- */
let HEADS=[],SLUGS={};
const hrRe=/^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const liRe=/^( {0,3})([-*+]|\d{1,9}[.)])( +|$)(.*)$/;
const htmlRe=/^ {0,3}<\/?(div|p|details|summary|img|a|h[1-6]|table|thead|tbody|tr|td|th|ul|ol|li|center|picture|source|br|hr|blockquote|pre|section|figure|figcaption|dl|dt|dd)(\s|\/?>|$)/i;
const indentOf=s=>s.match(/^ */)[0].length;
const isBlockStart=l=>/^ {0,3}(`{3,}|~{3,})/.test(l)||/^ {0,3}#{1,6}(\s|$)/.test(l)||/^ {0,3}>/.test(l)||hrRe.test(l)||/^ {0,3}([-*+]|1[.)])\s+\S/.test(l)||htmlRe.test(l);
const isDelim=s=>s.includes('-')&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(s);
const cells=s=>{s=s.trim();if(s[0]==='|')s=s.slice(1);if(/(^|[^\\])\|$/.test(s))s=s.slice(0,-1);return s.split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'))};
const tableAt=(L,i)=>L[i].includes('|')&&i+1<L.length&&isDelim(L[i+1])&&(L[i+1].includes('|')||cells(L[i]).length>1)&&cells(L[i]).length===cells(L[i+1]).length;

function slug(t){
  let b=t.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,'').trim().replace(/\s+/g,'-')||'section';
  const n=SLUGS[b]=(SLUGS[b]??-1)+1;return n?b+'-'+n:b;
}
function heading(lv,text){
  const h=inline(text),plain=unesc(h.replace(/<[^>]+>/g,'')),id=slug(plain);
  HEADS.push({lv,id,t:plain});
  return '<h'+lv+' id="'+esc(id)+'"><a class="anchor" href="#'+esc(id)+'">#</a>'+h+'</h'+lv+'>';
}
function codeBlock(code,lang){
  return '<div class="code"><div class="code-bar"><span>'+esc(lang||'code')+'</span><button class="copy" type="button">Copy</button></div><pre><code>'+hl(code,lang)+'</code></pre></div>';
}

function blocks(L,tight){
  const out=[];let i=0,m;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    // fenced code
    if((m=l.match(/^( {0,3})(`{3,}|~{3,})[ \t]*([^\s`]*)[^`]*$/))){
      const f=m[2],ind=m[1].length,lang=m[3],buf=[];
      const close=new RegExp('^ {0,3}'+(f[0]==='`'?'`':'~')+'{'+f.length+',}\\s*$');
      i++;
      while(i<L.length&&!close.test(L[i])){buf.push(L[i].slice(Math.min(ind,indentOf(L[i]))));i++}
      i++;out.push(codeBlock(buf.join('\n'),lang));continue;
    }
    // indented code
    if(/^ {4}\S/.test(l)){
      const buf=[];
      while(i<L.length&&(/^ {4}/.test(L[i])||(!L[i].trim()&&i+1<L.length&&/^ {4}/.test(L[i+1])))){buf.push(L[i].slice(4));i++}
      out.push(codeBlock(buf.join('\n'),''));continue;
    }
    // heading
    if((m=l.match(/^ {0,3}(#{1,6})(?:[ \t]+(.+?))?(?:[ \t]+#+)?[ \t]*$/))){out.push(heading(m[1].length,m[2]||''));i++;continue}
    // hr
    if(hrRe.test(l)){out.push('<hr>');i++;continue}
    // html comment
    if(/^\s*<!--/.test(l)){while(i<L.length&&!/-->/.test(L[i]))i++;i++;continue}
    // html block
    if(htmlRe.test(l)){
      const buf=[];while(i<L.length&&L[i].trim()){buf.push(L[i]);i++}
      out.push(sanitize(buf.join('\n')));continue;
    }
    // blockquote / alert
    if(/^ {0,3}>/.test(l)){
      let buf=[];
      while(i<L.length&&L[i].trim()){
        if(/^ {0,3}>/.test(L[i]))buf.push(L[i].replace(/^ {0,3}> ?/,''));
        else if(buf.length&&buf[buf.length-1].trim()&&!isBlockStart(L[i]))buf.push(L[i]);
        else break;
        i++;
      }
      const am=buf[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
      if(am){
        const k=am[1].toLowerCase();buf=[am[2],...buf.slice(1)];
        out.push('<blockquote class="alert alert-'+k+'"><p class="alert-title">'+k[0].toUpperCase()+k.slice(1)+'</p>'+blocks(buf)+'</blockquote>');
      }else out.push('<blockquote>'+blocks(buf)+'</blockquote>');
      continue;
    }
    // table
    if(tableAt(L,i)){
      const head=cells(L[i]),al=cells(L[i+1]).map(c=>/^:-+:$/.test(c)?'center':/-:$/.test(c)?'right':/^:-/.test(c)?'left':'');
      i+=2;const rows=[];
      while(i<L.length&&L[i].trim()&&L[i].includes('|')&&!isBlockStart(L[i])){rows.push(cells(L[i]));i++}
      const td=(t,c,k)=>'<'+t+(al[k]?' style="text-align:'+al[k]+'"':'')+'>'+inline(c||'')+'</'+t+'>';
      out.push('<div class="tw"><table><thead><tr>'+head.map((c,k)=>td('th',c,k)).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+head.map((_,k)=>td('td',r[k],k)).join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    // list
    if((m=l.match(liRe))){
      const ordered=/\d/.test(m[2]),delim=ordered?m[2].slice(-1):m[2],start=ordered?parseInt(m[2],10):1;
      const same=x=>x&&/\d/.test(x[2])===ordered&&(ordered?x[2].slice(-1):x[2])===delim;
      const items=[];let loose=false;
      while(i<L.length){
        const mm=L[i].match(liRe);
        if(!same(mm)||hrRe.test(L[i]))break;
        const sp=(mm[4]===''||mm[3].length>4)?1:mm[3].length,ci=mm[1].length+mm[2].length+sp;
        const item=[mm[4]];let hasBlank=false;i++;
        while(i<L.length){
          const x=L[i];
          if(!x.trim()){
            let j=i;while(j<L.length&&!L[j].trim())j++;
            if(j<L.length&&indentOf(L[j])>=ci){for(let k=i;k<j;k++)item.push('');hasBlank=true;i=j;continue}
            break;
          }
          if(indentOf(x)>=ci){item.push(x.slice(ci));i++;continue}
          if(item[item.length-1].trim()&&!isBlockStart(x)&&!liRe.test(x)){item.push(x.trim());i++;continue}
          break;
        }
        items.push({L:item,hasBlank});
        let j=i;while(j<L.length&&!L[j].trim())j++;
        if(j>i&&j<L.length){const nm=L[j].match(liRe);if(same(nm)&&!hrRe.test(L[j])){loose=true;i=j}}
      }
      out.push((ordered?'<ol'+(start!==1?' start="'+start+'"':'')+'>':'<ul>')+items.map(it=>{
        let cls='',h=blocks(it.L,!loose&&!it.hasBlank);
        h=h.replace(/^(<p>)?\[([ xX])\]\s+/,(x,p,c)=>{cls=' class="task"';return(p||'')+'<input type="checkbox" disabled'+(c===' '?'':' checked')+'> '});
        return '<li'+cls+'>'+h+'</li>';
      }).join('')+(ordered?'</ol>':'</ul>'));
      continue;
    }
    // paragraph (+ setext heading)
    const buf=[l];i++;let set=0;
    while(i<L.length){
      const x=L[i];
      if(!x.trim())break;
      if(/^ {0,3}=+\s*$/.test(x)){set=1;i++;break}
      if(/^ {0,3}-+\s*$/.test(x)){set=2;i++;break}
      if(isBlockStart(x)||tableAt(L,i))break;
      buf.push(x);i++;
    }
    const text=buf.map(s=>s.replace(/^\s+/,'')).join('\n').replace(/\s+$/,'');
    out.push(set?heading(set,text.replace(/\n/g,' ')):tight?inline(text):'<p>'+inline(text)+'</p>');
  }
  return out.join('\n');
}

function mdToHtml(src){
  src=src.replace(/\r\n?/g,'\n').replace(/^﻿/,'').replace(/^---\n[\s\S]*?\n(---|\.\.\.)[ \t]*(\n|$)/,'').replace(/\t/g,'    ');
  REFS={};HEADS=[];SLUGS={};
  const lines=[];let fence=null;
  for(const l of src.split('\n')){
    const f=l.match(/^ {0,3}(`{3,}|~{3,})/);
    if(f){if(!fence)fence=f[1][0];else if(f[1][0]===fence)fence=null}
    const d=!fence&&l.match(/^ {0,3}\[([^\]^][^\]]*)\]:\s*<?(\S+?)>?(?:\s+["'(](.*?)["')])?\s*$/);
    if(d)REFS[d[1].toLowerCase()]={url:d[2],title:d[3]};else lines.push(l);
  }
  return blocks(lines);
}

/* ---------- render / UI ---------- */
let handle=null,lastMod=0;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}

function render(text,name,keepScroll){
  const y=window.scrollY;
  body.classList.remove('is-empty');
  doc.innerHTML=mdToHtml(text);
  const heads=HEADS.filter(h=>h.lv<=4);
  toc.innerHTML=heads.length>1?'<h6>Contents</h6>'+heads.map(h=>'<a class="l'+h.lv+'" href="#'+esc(h.id)+'" title="'+esc(h.t)+'">'+esc(h.t)+'</a>').join(''):'';
  $('#tocbtn').style.display=heads.length>1?'':'none';
  if(heads.length<2)body.classList.add('toc-off');
  const words=(doc.textContent.match(/\S+/g)||[]).length;
  $('#fname').textContent=name||'Untitled';
  $('#meta').textContent=words.toLocaleString()+' words · '+Math.max(1,Math.round(words/220))+' min read';
  document.title=(name||'Untitled')+' — MD Viewer';
  spy();
  window.scrollTo({top:keepScroll?y:0,behavior:'instant'});
  progress();
}

/* toc scrollspy + progress */
let spyIO;
function spy(){
  if(spyIO)spyIO.disconnect();
  const links=[...toc.querySelectorAll('a')];if(!links.length)return;
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  spyIO=new IntersectionObserver(es=>{
    for(const e of es)if(e.isIntersecting){links.forEach(a=>a.classList.remove('on'));const a=map.get(e.target.id);if(a){a.classList.add('on');a.scrollIntoView({block:'nearest'})}}
  },{rootMargin:'-60px 0px -75% 0px'});
  doc.querySelectorAll('h1,h2,h3,h4').forEach(h=>map.has(h.id)&&spyIO.observe(h));
}
function progress(){const d=document.documentElement,m=d.scrollHeight-innerHeight;$('#bar').style.width=(m>0?scrollY/m*100:0)+'%'}
addEventListener('scroll',progress,{passive:true});

/* file loading */
async function useHandle(h){
  handle=h;const f=await h.getFile();lastMod=f.lastModified;render(await f.text(),f.name);
}
async function openFile(){
  if(window.showOpenFilePicker){
    try{const[h]=await showOpenFilePicker({types:[{description:'Markdown / text',accept:{'text/markdown':['.md','.markdown','.mdown','.mkd'],'text/plain':['.txt']}}]});await useHandle(h)}catch(e){}
  }else $('#file').click();
}
setInterval(async()=>{
  if(!handle||document.hidden)return;
  try{const f=await handle.getFile();if(f.lastModified!==lastMod){lastMod=f.lastModified;render(await f.text(),f.name,true);toast('Reloaded ✨')}}catch(e){}
},1000);

$('#open').onclick=openFile;
$('#drop').onclick=openFile;
$('#drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openFile()};
$('#file').onchange=async e=>{const f=e.target.files[0];if(f){handle=null;render(await f.text(),f.name)}e.target.value=''};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();openFile()}});

addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)body.classList.remove('drag')});
addEventListener('drop',async e=>{
  e.preventDefault();body.classList.remove('drag');
  const it=e.dataTransfer.items&&e.dataTransfer.items[0];
  if(it&&it.getAsFileSystemHandle){try{const h=await it.getAsFileSystemHandle();if(h&&h.kind==='file'){await useHandle(h);return}}catch(_){}}
  const f=e.dataTransfer.files[0];if(f){handle=null;render(await f.text(),f.name)}
});
addEventListener('paste',e=>{
  if(/input|textarea/i.test(e.target.tagName))return;
  const t=e.clipboardData.getData('text');if(t){handle=null;render(t,'Pasted text')}
});

/* theme + toc toggles */
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const root=document.documentElement;
root.dataset.theme=store.get('mdv-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';store.set('mdv-theme',root.dataset.theme)};
if(innerWidth<1000)body.classList.add('toc-off');
$('#tocbtn').onclick=()=>body.classList.toggle('toc-off');

/* clicks: anchors, copy */
document.addEventListener('click',e=>{
  const cp=e.target.closest('.copy');
  if(cp){
    const t=cp.closest('.code').querySelector('pre').textContent;
    const done=()=>{cp.textContent='Copied!';setTimeout(()=>cp.textContent='Copy',1200)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done,()=>{
      const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();done()});
    return;
  }
  const a=e.target.closest('a[href]');
  if(!a)return;
  const h=a.getAttribute('href');
  if(h[0]==='#'){
    e.preventDefault();
    const el=document.getElementById(decodeURIComponent(h.slice(1)));
    if(el)el.scrollIntoView({behavior:'smooth'});
    if(innerWidth<1000&&a.closest('nav'))body.classList.add('toc-off');
  }
});

/* boot: markdown injected by the launcher (base64) */
const boot=document.getElementById('boot');
if(boot&&boot.textContent.trim()){
  const bytes=Uint8Array.from(atob(boot.textContent.trim()),c=>c.charCodeAt(0));
  render(new TextDecoder().decode(bytes),boot.dataset.name);
}
})();
</script>
