[workspace]
members = [".", "crates/engine"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/harsh9524/cutemarkdown"

[workspace.dependencies]
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "persistence", "x11", "wayland"] }
egui_extras = { version = "0.36", features = ["file", "image", "svg", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[package]
name = "cutemarkdown"
description = "A fast, minimal, native Markdown reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cutemarkdown"
path = "src/main.rs"

[dependencies]
engine = { package = "cutemarkdown-engine", path = "crates/engine" }
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native open dialog. Win32 COM dialog on Windows; xdg-desktop-portal elsewhere (no GTK).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-enough dev builds: optimize dependencies, keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
