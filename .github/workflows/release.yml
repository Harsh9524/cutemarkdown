name: Release

# Publish a GitHub Release with the installer and the portable zip attached, either by pushing a
# tag like v1.0.0 (it must match the version in Cargo.toml) or by running this workflow by hand
# (Actions > Release > Run workflow), which tags the selected commit as v<Cargo version>.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release tag (from the pushed tag, or v<Cargo version> when run by hand)
        id: tag
        run: |
          version=$(bash scripts/version.sh)
          version=${version%$'\r'}   # Windows tools end lines with CRLF and $(...) keeps the CR
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match version $version in Cargo.toml"
              exit 1
            fi
          else
            tag="v$version"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo build --release --locked --bin cutemarkdown

      - name: Check imports (Windows system DLLs only)
        run: python scripts/check-imports.py target/release/cutemarkdown.exe

      - name: Ensure NSIS
        run: |
          if ! command -v makensis >/dev/null 2>&1 \
             && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ] \
             && [ ! -x "/c/Program Files/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: Package (installer and portable zip)
        run: bash scripts/package.sh --exe target/release/cutemarkdown.exe --out dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*-setup-x64.exe ./*-portable-x64.zip | sed 's# \./# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: cutemarkdown ${{ steps.tag.outputs.name }}
          files: |
            dist/*-setup-x64.exe
            dist/*-portable-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # v1.2.3-rc.1 and friends are marked as pre-releases.
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          fail_on_unmatched_files: true
